name: Temporary screenshot transfer

on:
  push:
    paths:
      - '.github/workflows/temp-screenshot-transfer.yml'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: camera-more-screenshot
          path: Screenshot_20261117_145355_Camera.jpg
          if-no-files-found: error
          retention-days: 1
