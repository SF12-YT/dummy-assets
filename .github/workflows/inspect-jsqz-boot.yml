name: Inspect S10e boot image for JSQZ

on:
  workflow_dispatch:
  push:
    paths:
      - "boot.img.gz"
      - ".github/workflows/inspect-jsqz-boot.yml"
      - "jsqz-analysis-trigger.txt"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify and unpack boot partition image
        shell: bash
        run: |
          set -euo pipefail
          test -f boot.img.gz
          echo "873cf46e08c0c141d7049d1c45aa900d05533ff0fc8377c3a4a9bc9cb06f6509  boot.img.gz" | sha256sum -c -
          gzip -t boot.img.gz
          mkdir -p out
          gzip -dc boot.img.gz > out/boot.img
          echo "Decompressed size: $(stat -c %s out/boot.img) bytes" | tee out/archive-check.txt
          echo "Expected partition size: 57671680 bytes" | tee -a out/archive-check.txt
          test "$(stat -c %s out/boot.img)" -eq 57671680
          file out/boot.img | tee out/file-identification.txt
          xxd -l 256 out/boot.img > out/boot-header-hexdump.txt

      - name: Parse Android boot header and extract kernel payload
        shell: bash
        run: |
          python3 - <<'PY'
          import os, struct
          image_path = "out/boot.img"
          out_dir = "out"
          data = open(image_path, "rb").read()
          report = []
          def u32(off):
              return struct.unpack_from("<I", data, off)[0]
          if data[:8] != b"ANDROID!":
              report.append("No ANDROID! magic at offset 0.")
              report.append("This may be a Samsung-wrapped or otherwise non-standard boot image.")
              report.append("Kernel extraction was not attempted; inspect file-identification and hexdump.")
          else:
              version = u32(40)
              report += ["Android boot image magic: ANDROID!", f"Header version: {version}"]
              if version <= 2:
                  kernel_size = u32(8)
                  ramdisk_size = u32(16)
                  page_size = u32(36)
                  if page_size < 512 or page_size > 65536 or page_size & (page_size - 1):
                      raise SystemExit(f"Implausible legacy page size: {page_size}")
                  kernel_offset = page_size
                  ramdisk_offset = ((kernel_offset + kernel_size + page_size - 1) // page_size) * page_size
                  report += [f"Page size: {page_size}", f"Kernel size: {kernel_size}", f"Kernel offset: {kernel_offset}", f"Ramdisk size: {ramdisk_size}", f"Ramdisk offset: {ramdisk_offset}"]
              elif version in (3, 4):
                  kernel_size = u32(8)
                  ramdisk_size = u32(12)
                  page_size = 4096
                  kernel_offset = page_size
                  ramdisk_offset = ((kernel_offset + kernel_size + page_size - 1) // page_size) * page_size
                  report += [f"Page size: {page_size}", f"Kernel size: {kernel_size}", f"Kernel offset: {kernel_offset}", f"Ramdisk size: {ramdisk_size}", f"Ramdisk offset: {ramdisk_offset}"]
              else:
                  raise SystemExit(f"Unsupported Android boot header version: {version}")
              end = kernel_offset + kernel_size
              if kernel_size == 0 or end > len(data):
                  raise SystemExit(f"Kernel range is invalid: {kernel_offset}..{end}, image size {len(data)}")
              with open(os.path.join(out_dir, "kernel.bin"), "wb") as f:
                  f.write(data[kernel_offset:end])
              report.append("Kernel payload extracted to kernel.bin.")
          open(os.path.join(out_dir, "boot-header.txt"), "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Identify kernel format and search JSQZ references
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f out/kernel.bin ]; then
            file out/kernel.bin | tee out/kernel-identification.txt
            sha256sum out/kernel.bin | tee out/kernel-sha256.txt
            strings -a -n 6 out/kernel.bin | grep -Ei 'jsqz|exynos-jsqz|jpeg.?sqz|sqz_ioctl|jsqz_ioctl|jsqz_process|jsqz_open|jsqz_probe|18b30000' | sort -u > out/jsqz-strings.txt
            echo "Matching strings: $(wc -l < out/jsqz-strings.txt)" | tee out/jsqz-search-summary.txt
          else
            echo "No kernel.bin was extracted; see boot-header.txt and hexdump." > out/jsqz-search-summary.txt
          fi
          ls -lh out

      - name: Recover kernel symbols and disassemble JSQZ driver
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out analysis
          if [ ! -s out/kernel.bin ]; then
            echo "No extracted kernel payload." > out/kallsyms-analysis.txt
          else
            sudo apt-get update -qq
            sudo apt-get install -y binutils-aarch64-linux-gnu
            python3 -m venv /tmp/vmlinux-to-elf-venv
            /tmp/vmlinux-to-elf-venv/bin/pip install --disable-pip-version-check "vmlinux-to-elf==1.4.0" > out/vmlinux-to-elf-install.txt 2>&1
            /tmp/vmlinux-to-elf-venv/bin/vmlinux-to-elf out/kernel.bin out/vmlinux.elf > out/vmlinux-to-elf.log 2>&1
            tool_rc=$?
            echo "vmlinux-to-elf exit code: ${tool_rc}" >> out/vmlinux-to-elf.log
            if [ "${tool_rc}" -eq 0 ] && [ -s out/vmlinux.elf ]; then
              file out/vmlinux.elf > out/recovered-elf-identification.txt
              aarch64-linux-gnu-nm -n -S --defined-only out/vmlinux.elf | grep -Ei 'jsqz|sqz' > out/jsqz-symbols.txt || true
              aarch64-linux-gnu-nm -n -S --defined-only out/vmlinux.elf | grep -Ei 'jsqz|sqz' | wc -l > out/jsqz-symbol-count.txt || true
              python3 - <<'PY'
          import re
          import subprocess

          elf = "out/vmlinux.elf"
          nm = subprocess.run(
              ["aarch64-linux-gnu-nm", "-n", "-S", "--defined-only", elf],
              check=True, text=True, capture_output=True
          )
          symbols = []
          for line in nm.stdout.splitlines():
              fields = line.split()
              if len(fields) >= 3 and fields[-2] in {"T", "t", "W", "w"}:
                  name = fields[-1]
                  if re.search(r"jsqz|sqz", name, re.IGNORECASE):
                      symbols.append(name)
          symbols = list(dict.fromkeys(symbols))
          with open("out/jsqz-driver-disassembly.txt", "w") as report:
              report.write("Recovered JSQZ/SQZ kernel function disassembly\\n")
              report.write(f"Matching function symbols: {len(symbols)}\\n\\n")
              for name in symbols:
                  report.write(f"===== {name} =====\\n")
                  result = subprocess.run(
                      ["aarch64-linux-gnu-objdump", "-d", "-C", f"--disassemble={name}", elf],
                      text=True, capture_output=True
                  )
                  report.write(result.stdout or result.stderr)
                  report.write("\\n")
          if not symbols:
              with open("out/jsqz-driver-disassembly.txt", "a") as report:
                  report.write("No matching function symbols were recovered. Check the kallsyms and nm reports.\\n")
          PY
            else
              echo "The kernel-to-ELF conversion failed; see vmlinux-to-elf.log and install log." > out/kallsyms-analysis.txt
            fi
          fi
          strings -a -t x -n 5 out/kernel.bin 2>/dev/null | grep -Ei 'jsqz|exynos-jsqz|jpeg.?sqz|sqz_ioctl|jsqz_ioctl|jsqz_process|jsqz_open|jsqz_probe|18b30000' > out/jsqz-string-offsets.txt || true
          cp out/*.txt analysis/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add recovered S10e JSQZ kernel analysis"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Extract exact fallback Q-table from target kernel image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out analysis
          python3 - <<'PY'
          import struct
          from pathlib import Path

          kernel_path = Path("out/kernel.bin")
          if not kernel_path.is_file():
              raise SystemExit("out/kernel.bin is missing; cannot scan the original kernel payload.")

          payload = kernel_path.read_bytes()
          known_prefix = (
              0x01010101, 0x01010101, 0x01010101, 0x03020201,
              0x02020202, 0x03030402, 0x04050302, 0x04050505,
              0x06050404, 0x05050607, 0x04040607, 0x07060906,
              0x08080808, 0x09060508, 0x0a08090a
          )
          known_suffix = (
              0x02010101, 0x02040202, 0x05080402, 0x08080504,
              0x08080808, 0x08080808, 0x08080808, 0x08080808,
              0x08080808, 0x08080808, 0x08080808, 0x08080808,
              0x08080808, 0x08080808, 0x08080808
          )
          prefix_bytes = struct.pack("<15I", *known_prefix)
          suffix_bytes = struct.pack("<15I", *known_suffix)

          candidates = []
          cursor = 0
          while True:
              offset = payload.find(prefix_bytes, cursor)
              if offset < 0:
                  break
              cursor = offset + 1
              suffix_start = offset + 16 * 4
              if payload[suffix_start:suffix_start + len(suffix_bytes)] == suffix_bytes:
                  if offset + 128 <= len(payload):
                      candidates.append(offset)

          if not candidates:
              raise SystemExit(
                  "Could not locate the table signature in kernel.bin. "
                  "The target table may differ from the known 30-word signature."
              )

          tables = [(offset, payload[offset:offset + 128]) for offset in candidates]
          distinct_tables = {raw for _, raw in tables}
          if len(distinct_tables) != 1:
              offsets = ", ".join(f"0x{o:x}" for o, _ in tables)
              raise SystemExit(
                  f"Found multiple different table candidates at {offsets}; refusing to guess."
              )

          offset, raw = tables[0]
          words = struct.unpack("<32I", raw)
          observed_black = (
              0x01010101, 0x01010101, 0x01010101, 0x03020201,
              0x02020202, 0x03030402, 0x04050302, 0x04050505,
              0x06050404, 0x05050607, 0x04040607, 0x07060906,
              0x08080808, 0x09060508, 0x0a08090a, 0x0a080807,
              0x02010101, 0x02040202, 0x05080402, 0x08080504,
              0x08080808, 0x08080808, 0x08080808, 0x08080808,
              0x08080808, 0x08080808, 0x08080808, 0x08080808,
              0x08080808, 0x08080808, 0x08080808, 0x0a080808
          )
          mismatches = [
              (i, actual, observed)
              for i, (actual, observed) in enumerate(zip(words, observed_black))
              if actual != observed
          ]

          lines = [
              "Exact JSQZ fallback-table bytes recovered from the original target kernel payload",
              f"kernel.bin file offset: 0x{offset:x}",
              f"Number of matching locations: {len(candidates)}",
              f"Candidate offsets: {', '.join(f'0x{o:x}' for o in candidates)}",
              "Words (little-endian u32):"
          ]
          lines.extend(f"{i:02d}: 0x{word:08x}" for i, word in enumerate(words))
          lines.extend([
              "",
              "Raw bytes (hex):",
              raw.hex(),
              "",
              "Comparison with the observed black run:",
              f"Exact word matches: {32 - len(mismatches)}/32"
          ])
          lines.extend(
              f"word {i}: target default 0x{actual:08x}, black output 0x{observed:08x}"
              for i, actual, observed in mismatches
          )
          report = "\n".join(lines) + "\n"
          Path("out/jsqz-default-table.txt").write_text(report)
          Path("analysis/jsqz-default-table.txt").write_text(report)
          print(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/jsqz-default-table.txt
          if ! git diff --cached --quiet; then
            git commit -m "Extract exact JSQZ fallback table from target kernel"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Analyse matching public S10e JSQZ HAL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out analysis
          sudo apt-get update -qq
          sudo apt-get install -y binutils-arm-linux-gnueabi
          url="https://raw.githubusercontent.com/AndroidBlobs/vendor_samsung_beyond0/ff25fa6c37517537715ec9e710210f2d0820bfc2/proprietary/vendor/lib/libhwjsqz.so"
          curl -fL --retry 3 "$url" -o out/reference-libhwjsqz.so
          blob_hash="$(git hash-object out/reference-libhwjsqz.so)"
          echo "Git blob SHA-1: $blob_hash" | tee out/reference-hal-archive-check.txt
          test "$blob_hash" = "d1378187a1e0478397794b3e25afb35700920a7f"
          file out/reference-libhwjsqz.so | tee out/reference-hal-file.txt
          sha256sum out/reference-libhwjsqz.so | tee out/reference-hal-sha256.txt
          readelf -h -A -d -n -Ws out/reference-libhwjsqz.so > out/reference-hal-elf-report.txt
          nm -D -n --defined-only -C out/reference-libhwjsqz.so > out/reference-hal-dynamic-symbols.txt
          strings -a -t x out/reference-libhwjsqz.so | grep -Ei 'jsqz|sqz|quant|quality|/dev/jsqz|invalid image|permission denied|mmap|ion' > out/reference-hal-strings.txt || true
          python3 - <<'PY'
          import re
          import subprocess

          so = "out/reference-libhwjsqz.so"
          result = subprocess.run(
              ["nm", "-D", "-S", "-n", "--defined-only", so],
              check=True, text=True, capture_output=True
          )
          selected = []
          for line in result.stdout.splitlines():
              fields = line.split(maxsplit=3)
              if len(fields) != 4:
                  continue
              address, size, kind, symbol = fields
              if kind.upper() not in {"T", "W"}:
                  continue
              demangled = subprocess.run(
                  ["c++filt", symbol], check=True, text=True, capture_output=True
              ).stdout.strip()
              if re.search(r"ExynosJsqz|ExynosSqzBase|c_run_jsqz", demangled):
                  start = int(address, 16) & ~1
                  end = start + int(size, 16)
                  if end > start:
                      selected.append((start, end, demangled, symbol))
          with open("out/reference-hal-disassembly.txt", "w") as report:
              report.write(f"HAL functions recovered with explicit symbol address/size: {len(selected)}\\n")
              for start, end, demangled, symbol in selected:
                  report.write(f"\\n===== 0x{start:08x}..0x{end:08x} {demangled} [{symbol}] =====\\n")
                  dis = subprocess.run(
                      ["arm-linux-gnueabi-objdump", "-d", "-C",
                       f"--start-address=0x{start:x}", f"--stop-address=0x{end:x}", so],
                      text=True, capture_output=True
                  )
                  report.write(dis.stdout or dis.stderr)
          PY
          readelf -n out/reference-libhwjsqz.so | grep -i 'Build ID' | tee out/reference-hal-build-id.txt || true
          if grep -qi '2954034e91ab9505aef839b7d9feded0' out/reference-hal-build-id.txt; then
            echo "EXACT BUILD-ID MATCH with the user's previously inspected /vendor/lib/libhwjsqz.so" | tee out/reference-hal-version-match.txt
          else
            echo "Reference library differs from the user's previously inspected Build-ID 2954034e91ab9505aef839b7d9feded0; use as a comparison only." | tee out/reference-hal-version-match.txt
          fi
          camera_url="https://raw.githubusercontent.com/AndroidBlobs/vendor_samsung_beyond0/ff25fa6c37517537715ec9e710210f2d0820bfc2/proprietary/vendor/lib/libexynoscamera3.so"
          curl -fL --retry 3 "$camera_url" -o out/reference-camera-libexynoscamera3.so
          camera_blob_hash="$(git hash-object out/reference-camera-libexynoscamera3.so)"
          echo "Git blob SHA-1: $camera_blob_hash" | tee out/reference-camera-hal-archive-check.txt
          test "$camera_blob_hash" = "f66a4d4bb1e1ac5c78654d1f957868af8a2972d9"
          file out/reference-camera-libexynoscamera3.so | tee out/reference-camera-hal-file.txt
          sha256sum out/reference-camera-libexynoscamera3.so | tee out/reference-camera-hal-sha256.txt
          readelf -h -d -n -Ws out/reference-camera-libexynoscamera3.so > out/reference-camera-hal-elf-report.txt
          readelf -n out/reference-camera-libexynoscamera3.so | grep -i 'Build ID' | tee out/reference-camera-hal-build-id.txt || true
          nm -D -C --undefined-only out/reference-camera-libexynoscamera3.so | grep -Ei 'jsqz|sqz|jpeg' > out/reference-camera-hal-undefined-jsqz.txt || true
          strings -a -t x out/reference-camera-libexynoscamera3.so | grep -Ei 'jsqz|sqz|quant|quality|jpeg squeezer|setImageInfo|setJsqzConfig|c_run_jsqz|/dev/jsqz' > out/reference-camera-hal-strings.txt || true
          arm-linux-gnueabi-objdump -d -C out/reference-camera-libexynoscamera3.so > out/reference-camera-hal-disassembly.tmp
          python3 - <<'PY'
          import re
          import subprocess

          src = "out/reference-camera-libexynoscamera3.so"
          dis = subprocess.run(
              ["arm-linux-gnueabi-objdump", "-d", "-C", src],
              check=True, text=True, capture_output=True
          ).stdout.splitlines()
          names = [
              "ExynosJsqz::create", "ExynosJsqz::setInBuf",
              "ExynosJsqz::setImageInfo", "ExynosJsqz::setJsqzConfig",
              "ExynosJsqz::run", "ExynosJsqz::getResultQT",
              "ExynosJsqz::destroy"
          ]
          call_re = re.compile(r"\bblx?\b")
          label_re = re.compile(r"^([0-9a-f]+) <(.+)>:$")
          current = "(unknown section)"
          hits = []
          for i, line in enumerate(dis):
              label = label_re.match(line.strip())
              if label:
                  current = f"{label.group(2)} @ 0x{label.group(1)}"
              if call_re.search(line) and any(name in line for name in names):
                  hits.append((i, current, line.strip()))
          with open("out/reference-camera-hal-jsqz-xrefs.txt", "w") as f:
              f.write(f"Direct call-site references found: {len(hits)}\\n")
              f.write("Reference binary only; its Build ID differs from the target device library.\\n")
              for i, function, line in hits:
                  f.write(f"\\n===== caller: {function} =====\\n")
                  for context in dis[max(0, i-14):min(len(dis), i+5)]:
                      f.write(context + "\\n")
          PY
          rm -f out/reference-camera-hal-disassembly.tmp
          cp out/reference-camera-hal-jsqz-xrefs.txt analysis/
          if grep -qi '1b7a6dfaf4dcbf7034b467a6fcec2fc1' out/reference-camera-hal-build-id.txt; then
            echo "EXACT BUILD-ID MATCH with the user's previously inspected libexynoscamera3.so" | tee out/reference-camera-hal-version-match.txt
          else
            echo "Reference camera HAL differs from the user's previously inspected Build-ID 1b7a6dfaf4dcbf7034b467a6fcec2fc1; use as a comparison only." | tee out/reference-camera-hal-version-match.txt
          fi
          cp out/reference-camera-hal-*.txt analysis/
          cp out/reference-hal-*.txt analysis/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/reference-hal-*.txt analysis/reference-camera-hal-*.txt
          if ! git diff --cached --quiet; then
            git commit -m "Analyse S10e JSQZ HAL reference binary"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Disassemble target ION and DMA-BUF ioctl handlers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out analysis
          if [ ! -s out/vmlinux.elf ]; then
            echo "Recovered vmlinux.elf unavailable; target ION/DMA-BUF disassembly was not possible." > out/ion-dmabuf-kernel-disassembly.txt
            echo "No recovered ELF." > out/ion-dmabuf-kernel-symbols.txt
          else
            python3 - <<'PY'
          import subprocess

          elf = "out/vmlinux.elf"
          wanted = (
              "dma_buf_get", "dma_buf_attach", "dma_buf_map_attachment",
              "dma_buf_unmap_attachment", "dma_buf_detach", "dma_buf_put",
              "ion_iovmm_map", "ion_iovmm_unmap",
              "exynos_iovmm_map_userptr", "exynos_iovmm_unmap_userptr"
          )
          nm = subprocess.run(
              ["aarch64-linux-gnu-nm", "-n", "-S", "--defined-only", elf],
              check=True, text=True, capture_output=True
          )
          selected = []
          for line in nm.stdout.splitlines():
              fields = line.split()
              if len(fields) < 4:
                  continue
              address, size, kind, name = fields[-4:]
              if kind not in {"T", "t", "W", "w"}:
                  continue
              size_value = int(size, 16)
              if size_value == 0 or size_value > 0x8000:
                  continue
              if any(term in name.lower() for term in wanted):
                  selected.append((address, size_value, kind, name))
          selected = selected[:20]

          with open("out/ion-dmabuf-kernel-symbols.txt", "w") as report:
              report.write(f"Matched bounded function symbols: {len(selected)}\\n")
              for address, size, kind, name in selected:
                  report.write(f"{address} {size:08x} {kind} {name}\\n")

          with open("out/ion-dmabuf-kernel-disassembly.txt", "w") as report:
              report.write("Selected ION / DMA-BUF mapping functions from the target boot image\\n")
              report.write("Only named text symbols with nonzero sizes <= 0x8000 are included.\\n")
              for address, size, kind, name in selected:
                  report.write(f"\\n===== {name} @ {address}, size 0x{size:x} =====\\n")
                  dis = subprocess.run(
                      ["aarch64-linux-gnu-objdump", "-d", "-C",
                       f"--start-address=0x{address}",
                       f"--stop-address=0x{int(address, 16) + size:x}", elf],
                      text=True, capture_output=True
                  )
                  report.write(dis.stdout or dis.stderr)
          PY
          fi
          cp out/ion-dmabuf-kernel-*.txt analysis/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ion-dmabuf-kernel-*.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add bounded target ION and DMA-BUF function analysis"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish analysis outputs as a private GitHub release
        if: always() && hashFiles('out/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="jsqz-boot-analysis"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.txt --clobber
          else
            gh release create "$tag" out/*.txt --title "S10e JSQZ boot analysis" --notes "Automatically extracted from the private S10e boot partition image. Includes the kernel payload and JSQZ string scan."
          fi
