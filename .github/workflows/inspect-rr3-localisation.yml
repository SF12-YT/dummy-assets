name: Temporary RR3 localisation inspection
on:
  push:
    branches:
      - tmp/rr3-localisation-inspect-20261115
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect the supplied localisation files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          KEY = bytes([0xB1, 0x75, 0xA5, 0x23, 0xF3, 0xC2, 0xB6, 0x15])
          DROP = 211

          def transform(raw):
              s = list(range(256))
              j = 0
              for k in range(256):
                  j = (j + s[k] + KEY[k & 7]) & 255
                  s[k], s[j] = s[j], s[k]
              i = j = 0
              for _ in range(DROP):
                  i = (i + 1) & 255
                  j = (j + s[i]) & 255
                  s[i], s[j] = s[j], s[i]
              out = bytearray(len(raw))
              for n, byte in enumerate(raw):
                  i = (i + 1) & 255
                  j = (j + s[i]) & 255
                  s[i], s[j] = s[j], s[i]
                  out[n] = byte ^ s[(s[i] + s[j]) & 255]
              return bytes(out)

          def is_plain(raw, game_text=False):
              if game_text and raw.startswith(b"GAMETEXT_"):
                  return True
              if raw.startswith(b"\\xef\\xbb\\xbf"):
                  return True
              sample = raw[:256]
              return bool(sample) and all(
                  b in (9, 10, 11, 12, 13) or b >= 32 for b in sample
              )

          def load(name, game_text=False):
              raw = Path(name).read_bytes()
              plain = raw if is_plain(raw, game_text) else transform(raw)
              print(f"{name}: {len(raw)} bytes, {'already plain' if plain is raw else 'RC4-decoded'}")
              return plain.decode("utf-8-sig", errors="replace").splitlines()

          keys = load("gametext.txt", True)
          values = load("text_en.txt")
          print(f"key lines: {len(keys)}; English lines: {len(values)}")
          if len(keys) != len(values):
              print("WARNING: line counts differ; checking indices carefully")
          targets = [
              "GAMETEXT_SERIES_TITLE_V8_SUPERCARS_2018",
              "GAMETEXT_SERIES_TITLE_V8_CHAMPIONSHIP_2018",
          ]
          found = set()
          for i, key in enumerate(keys):
              if key in targets or ("SERIES_TITLE" in key and "V8" in key):
                  found.add(key)
                  print(f"ENTRY index={i} key={key!r} english={values[i] if i < len(values) else '<NO MATCHING LINE>'!r}")
          print("TARGETS:")
          for key in targets:
              if key not in found:
                  print(f"  {key}: NOT PRESENT")
          print("Nearby championship/supercars labels:")
          count = 0
          for i, key in enumerate(keys):
              if any(word in key.upper() for word in ("SUPERCAR", "V8_CHAMP", "V8_SERIES")):
                  print(f"  {i}: {key!r} => {values[i] if i < len(values) else '<NO MATCHING LINE>'!r}")
                  count += 1
                  if count >= 30:
                      break
          PY
